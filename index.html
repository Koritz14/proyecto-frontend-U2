<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turismo Extremo Sur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="#quienes">¿Quiénes somos?</a></li>
            <li><a href="#servicios">Nuestros servicios</a></li>
            <li><a href="#contacto">Contáctanos</a></li>
        </ul>
    </nav>

    <section id="quienes">
        <h2>¿Quiénes somos?</h2>

        <div class="integrantes">
            <div class="persona">
                <img src="img/mujer.jpg" alt="Integrante"> <!-- añadido-->
                <p>Luisangeli Lozada</p>
                <p>Ingeniería en Informática / Programadora</p>
            </div>
            <div class="persona">
                <img src="img/mujer2.jpg" alt="Integrante"> <!-- añadido-->
                <p>Atalía Spielmann</p>
                <p>Ingeniería en Informática / Programadora</p>
            </div>
            <div class="persona">
                <img src="img/hombre.jpg" alt="Integrante"> <!-- añadido-->
                <p>Mauro Gonzalez</p>
                <p>Ingeniería en Informática / Programador</p>
            </div>
        </div>
    </section>

    <section id="servicios">
        <h2>Nuestros Servicios</h2>

        <div id="contenedor-servicios">
            <!-- esto se llena con JS -->
        </div>
    </section>

    <section id="contacto">
        <h2>Contáctanos</h2>
        
        <p id="mensaje"></p>
        <form id="formulario">

            <label for="nombre">Nombre:</label> 
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>

            <label for="celular">Celular:</label> 
            <input type="text" id="celular" placeholder="Ej: 912345678" required>

            <label for="email">Email:</label> 
            <input type="email" id="email" placeholder="Ej: correo@gmail.com" required>

            <label for="pais">País:</label> 
            <input type="text" id="pais" placeholder="Ej: Chile" required>

            <label for="ciudad">Ciudad:</label> 
            <input type="text" id="ciudad" placeholder="Ej: Santiago" required>

            <label for="consulta">Consulta:</label> 
            <textarea id="consulta" placeholder="Escribe tu consulta aquí..." required></textarea>

            <button type="submit">Enviar</button>

        </form>
        
        
    </section>

    <script src="scripts.js"></script>

</body>
</html>
